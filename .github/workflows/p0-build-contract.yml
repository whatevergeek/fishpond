name: P0 build contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-contract:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            configure_preset: dev-macos
            test_preset: p0-build-contract-macos
          - os: windows-2022
            configure_preset: dev-windows
            test_preset: p0-build-contract-windows
          - os: ubuntu-24.04
            configure_preset: dev-linux
            test_preset: p0-build-contract-linux

    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.configure_preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.configure_preset }} --parallel
      - name: Run build-contract tests
        run: ctest --preset ${{ matrix.test_preset }}
      - name: Export Phase 0 traceability evidence
        run: cmake --build --preset ${{ matrix.configure_preset }} --target traceability-report
      - name: Upload Phase 0 evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-evidence-${{ matrix.os }}
          path: |
            build/${{ matrix.configure_preset }}/ctest-results.xml
            build/${{ matrix.configure_preset }}/traceability.json
          if-no-files-found: error

  juce-smoke-macos:
    name: macOS JUCE VST3/AU smoke
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure locked JUCE fixture
        run: cmake --preset juce-fixture-macos
      - name: Run JUCE lifecycle spike
        run: cmake --build --preset juce-fixture-macos --target run-juce-lifecycle-spike
      - name: Build VST3 and AU fixture artifacts
        run: cmake --build --preset juce-fixture-macos --target FishpondFixtureInstrument_VST3 FishpondFixtureInstrument_AU
      - name: Upload JUCE smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p0-juce-smoke-macos
          path: |
            build/juce-fixture-macos/tests/fixtures/juce/FishpondFixtureInstrument_artefacts/Debug/VST3/*.vst3
            build/juce-fixture-macos/tests/fixtures/juce/FishpondFixtureInstrument_artefacts/Debug/AU/*.component
          if-no-files-found: error

  juce-lifecycle:
    name: ${{ matrix.os }} JUCE lifecycle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            preset: juce-fixture-windows
          - os: ubuntu-24.04
            preset: juce-fixture-linux
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libcurl4-openssl-dev libfreetype6-dev libgl1-mesa-dev
          libfontconfig1-dev libharfbuzz-dev libgtk-3-dev libwebkit2gtk-4.1-dev
          libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev
          libxi-dev libxrandr-dev libxrender-dev
      - name: Configure locked JUCE fixture
        run: cmake --preset ${{ matrix.preset }}
      - name: Run JUCE lifecycle spike
        run: cmake --build --preset ${{ matrix.preset }} --target run-juce-lifecycle-spike
      - name: Build VST3 fixture artifact
        run: cmake --build --preset ${{ matrix.preset }} --target FishpondFixtureInstrument_VST3
      - name: Upload JUCE lifecycle artifact
        uses: actions/upload-artifact@v4
        with:
          name: p0-juce-lifecycle-${{ matrix.os }}
          path: build/${{ matrix.preset }}/tests/fixtures/juce/FishpondFixtureInstrument_artefacts/**/VST3/*.vst3
          if-no-files-found: error
